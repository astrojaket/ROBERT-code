name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  OMP_NUM_THREADS: "3"
  OPENBLAS_NUM_THREADS: "3"
  MKL_NUM_THREADS: "3"
  NUMEXPR_NUM_THREADS: "3"
  VECLIB_MAXIMUM_THREADS: "3"
  NUMBA_NUM_THREADS: "3"
  OMP_THREAD_LIMIT: "3"

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development package
        run: python -m pip install -e ".[dev,perf,opacity,diagnostics]"

      - name: Lint
        run: ruff check .

      - name: Check retrieval interface types
        run: python -m mypy

      - name: Test with coverage floor
        run: |
          coverage run -m pytest
          coverage report

      - name: Build distributions
        run: python -m build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            run-examples: false
          - python-version: "3.11"
            run-examples: false
          - python-version: "3.12"
            run-examples: false
          - python-version: "3.13"
            run-examples: true
          - python-version: "3.14"
            run-examples: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run examples
        if: matrix.run-examples
        run: |
          python examples/plot_blackbody_reference.py
          python examples/plot_temperature_profile_families.py
          python examples/plot_free_chemistry_profiles.py
          python run_retrieval.py --config configurations/emission.yaml --validate-only
          python examples/configured_forward_model.py --validate-only
          ROBERT_BENCH_REPEAT=3 ROBERT_BENCH_WARMUP=1 python examples/benchmark_atmosphere_build.py
          ROBERT_OPACITY_IO_REPEAT=3 ROBERT_OPACITY_IO_WARMUP=1 python examples/benchmark_opacity_archive_io.py

  opacity-integration:
    name: exo_k correlated-k integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install opacity dependencies
        run: python -m pip install -e ".[dev,opacity]"

      - name: Test exo_k binning bridge
        env:
          NUMBA_CACHE_DIR: /tmp/robert-numba-cache
        run: python -m pytest tests/test_opacity_kta.py -k exok

  high-resolution-helpers:
    name: LBL/HRS helper tests (no external data)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install local test dependencies
        run: python -m pip install -e ".[dev,opacity]"

      - name: Run H-minus, observation, covariance, and retrieval helpers
        env:
          OMP_NUM_THREADS: "3"
          OPENBLAS_NUM_THREADS: "3"
          MKL_NUM_THREADS: "3"
          NUMEXPR_NUM_THREADS: "3"
          VECLIB_MAXIMUM_THREADS: "3"
          NUMBA_NUM_THREADS: "3"
          OMP_THREAD_LIMIT: "3"
        run: >-
          python -m pytest -q
          tests/test_hminus_continuum.py
          tests/test_high_resolution_observation.py
          tests/test_high_resolution_likelihoods.py
          tests/test_correlated_likelihood.py
          tests/test_mixed_multi_dataset_likelihood.py
          tests/test_multi_dataset_injection.py
          tests/test_validation_injection.py
          tests/test_hminus_workflow.py
          tests/test_public_high_resolution_api.py
          tests/test_combined_resolution_full_pymultinest.py
          tests/test_multinest.py
