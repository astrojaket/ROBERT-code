schema_version: 2

paths:
  observations_directory: ../../examples/outputs/r100_validation/emission/synthetic_observation.npz
  opacity_cache_directory: ../../examples/outputs/r100_validation/emission/opacity_cache
  output_directory: ../../examples/outputs/r100_validation/emission
  scratch_directory: ../../examples/outputs/r100_validation/emission/scratch

run:
  name: r100-emission-injection-recovery
  description: Local two-parameter emission validation using bundled R=100 H2O opacity.

bodies:
  planet:
    name: Synthetic hot Jupiter b
    radius_m: 80000000.0
    mass_kg: 1.1502935e27
  star:
    name: Synthetic K dwarf
    radius_m: 600000000.0
    effective_temperature_k: 5000.0
    log_g_cgs: 4.5
    metallicity_dex: 0.0
    spectrum_model: blackbody

observations:
  loader: robert_npz
  datasets: [synthetic_emission]
  verify_checksum: false
  dataset_options: {}

atmosphere:
  pressure:
    bottom_bar: 10.0
    top_bar: 1.0e-5
    layers: 32
  temperature:
    model: spline
    knot_pressure: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 0.1, 1.0, 10.0]
    knot_temperature_k: [900.0, 1000.0, 1150.0, 1300.0, 1450.0, 1600.0, 1700.0]
    extrapolation: clip
  chemistry:
    model: free
    species: [H2O]
    parameter_mode: log10
    parameter_names: {H2O: log_H2O}
    fixed_mixing_ratios: {}
    background_species: [H2, He]
    background_fractions: [0.8547, 0.1453]
    fill_background: true
    excess_policy: raise

clouds:
  model: none

opacity:
  format: exomol_kta
  resolution: R100
  species: [H2O]
  binning:
    num: 100
    use_rebin: false
    remove_zeros: true
    g_points: 8

radiative_transfer:
  model: emission
  geometry:
    model: normal_emission
  include_rayleigh: true
  gas_combination: random_overlap
  thermal_integration_backend: auto

likelihood:
  model: gaussian
  include_normalization: true

parameters:
  - name: log_H2O
    label: log10 H2O VMR
    value: -3.0
    prior: {type: uniform, lower: -4.5, upper: -2.0}

sampler:
  engine: multinest
  live_points: 60
  multinest_max_iterations: 0
  dlogz: 0.8
  sampling_efficiency: 0.8
  importance_nested_sampling: true
  multimodal: false
  iterations_before_update: 20
  resume: overwrite
  show_status: true
  seed: 2718

plotting:
  enabled: true
  retrieval: true
  forward: false
  style: default
  image_format: png
  dpi: 150
  max_posterior_samples: 5000
  posterior_predictive_samples: 100
  dataset_colors: {synthetic_emission: mediumpurple}
  parameter_labels:
    log_H2O: log10 H2O VMR

runtime:
  mpi_processes: auto
