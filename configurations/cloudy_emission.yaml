# Canonical cloudy hot-Jupiter emission retrieval using fixed MgSiO3 Mie data.
# Adapt clouds.material and the four cloud parameters for another condensate.

schema_version: 2
paths:
  observations_directory: ../data/wasp69b_schlawin2024
  fastchem_directory: ../data/chemistry/fastchem
  k_table_directory: ../opacity_data/ktables_exomol
  optical_constants_directory: ../data/optical_constants/exo_skryer
  output_directory: ../../ROBERT-runs/hot-jupiter-cloudy-emission-r1000/outputs
  opacity_cache_directory: ../../ROBERT-runs/hot-jupiter-cloudy-emission-r1000/opacity_cache
  scratch_directory: ../../ROBERT-runs/hot-jupiter-cloudy-emission-r1000/scratch
  project_directory: ../../ROBERT-runs/hot-jupiter-cloudy-emission-r1000
run:
  name: hot-jupiter-cloudy-emission-r1000
  description: WASP-69b one-region PG14 emission retrieval with a fixed MgSiO3 catalogue
    Mie cloud.
bodies:
  planet:
    name: WASP-69b
    radius_m: 75781520.0
    mass_kg: 4.935138e26
  star:
    name: WASP-69
    radius_m: 565568100.0
    effective_temperature_k: 4750.0
    log_g_cgs: 4.5
    metallicity_dex: 0.0
    spectrum_model: phoenix
observations:
  loader: schlawin2024_wasp69b
  datasets:
  - f322w2
  - f444w
  - lrs
  verify_checksum: true
atmosphere:
  pressure:
    bottom_bar: 100.0
    top_bar: 1.0e-06
    layers: 80
  temperature:
    model: parmentier_guillot_2014
    internal_temperature_k: 100.0
  chemistry:
    model: fastchem_equilibrium
    metallicity_parameter: metallicity
    carbon_to_oxygen_parameter: CtoO
    species:
    - label: H2O
      fastchem_name: H2O1
    - label: CO2
      fastchem_name: C1O2
    - label: CO
      fastchem_name: C1O1
    - label: CH4
      fastchem_name: C1H4
    - label: NH3
      fastchem_name: H3N1
    - label: SO2
      fastchem_name: O2S1
    - label: H2
      fastchem_name: H2
    - label: He
      fastchem_name: He
    constant_log10_vmr_parameters:
      SO2: log_SO2
clouds:
  model: mie_catalog
  material: MgSiO3
  particle_density_kg_m3: 3200.0
  geometric_stddev: 1.0
  quadrature_points: 1
  multiple_scattering_backend: sh4
opacity:
  format: exomol_kta
  resolution: R1000
  species:
  - H2O
  - CO2
  - CO
  - CH4
  - NH3
  - SO2
  binning:
    num: 300
    use_rebin: false
    remove_zeros: true
radiative_transfer:
  model: emission
  geometry:
    model: normal_emission
    points: 4
  include_rayleigh: true
  gas_combination: random_overlap
  thermal_integration_backend: auto
likelihood:
  model: gaussian
  include_normalization: true
parameters:
- name: metallicity
  label: '[M/H]'
  unit: dex
  prior:
    type: uniform
    lower: 0.0
    upper: 2.0
- name: CtoO
  label: C/O
  prior:
    type: uniform
    lower: 0.05
    upper: 1.5
- name: log_SO2
  label: log10(SO2 VMR)
  prior:
    type: uniform
    lower: -10.0
    upper: -4.0
- name: kappa_IR
  unit: m2 kg-1
  prior:
    type: log_uniform
    lower: 1.0e-05
    upper: 1.0
- name: gamma1
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: gamma2
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: T_irr
  unit: K
  prior:
    type: uniform
    lower: 800.0
    upper: 2200.0
- name: alpha
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
- name: log_cloud_mass_fraction
  prior:
    type: uniform
    lower: -12.0
    upper: -2.0
- name: log_cloud_radius_micron
  prior:
    type: uniform
    lower: -3.0
    upper: 1.0
- name: log_cloud_top_pressure_bar
  prior:
    type: uniform
    lower: -6.0
    upper: -2.0
- name: log_cloud_base_pressure_bar
  prior:
    type: uniform
    lower: -1.0
    upper: 2.0
sampler:
  engine: multinest
  live_points: 400
  dlogz: 0.5
  resume: resume
  show_status: false
  seed: 2712
runtime:
  mpi_processes: auto
plotting:
  enabled: true
