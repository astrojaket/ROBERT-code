# Cloud-free hot-Jupiter optimal-estimation benchmark.
# Use emission.yaml for direct MultiNest sampling of the same science model.

schema_version: 2
paths:
  observations_directory: ../data/wasp69b_schlawin2024
  fastchem_directory: ../data/chemistry/fastchem
  k_table_directory: ../opacity_data/ktables_exomol
  output_directory: ../examples/outputs/hot_jupiter_optimal_estimation
  opacity_cache_directory: ../examples/outputs/hot_jupiter_optimal_estimation/opacity_cache
  scratch_directory: ../examples/outputs/hot_jupiter_optimal_estimation/scratch
  project_directory: ..
run:
  name: hot-jupiter-optimal-estimation
  description: WASP-69b cloud-free PG14 emission benchmark using optimal estimation.
bodies:
  planet:
    name: WASP-69b
    radius_m: 75781520.0
    mass_kg: 4.935138e26
  star:
    name: WASP-69
    radius_m: 565568100.0
    effective_temperature_k: 4750.0
    log_g_cgs: 4.5
    metallicity_dex: 0.0
    spectrum_model: phoenix
observations:
  loader: schlawin2024_wasp69b
  datasets:
  - f322w2
  - f444w
  - lrs
  verify_checksum: true
atmosphere:
  pressure:
    bottom_bar: 100.0
    top_bar: 1.0e-06
    layers: 80
  temperature:
    model: parmentier_guillot_2014
    internal_temperature_k: 100.0
  chemistry:
    model: fastchem_equilibrium
    metallicity_parameter: metallicity
    carbon_to_oxygen_parameter: CtoO
    species:
    - label: H2O
      fastchem_name: H2O1
    - label: CO2
      fastchem_name: C1O2
    - label: CO
      fastchem_name: C1O1
    - label: CH4
      fastchem_name: C1H4
    - label: NH3
      fastchem_name: H3N1
    - label: SO2
      fastchem_name: O2S1
    - label: H2
      fastchem_name: H2
    - label: He
      fastchem_name: He
    constant_log10_vmr_parameters:
      SO2: log_SO2
clouds:
  model: none
opacity:
  format: exomol_kta
  resolution: R1000
  species:
  - H2O
  - CO2
  - CO
  - CH4
  - NH3
  - SO2
  binning:
    num: 300
    use_rebin: false
    remove_zeros: true
radiative_transfer:
  model: emission
  geometry:
    model: normal_emission
    points: 4
  include_rayleigh: true
  gas_combination: random_overlap
  thermal_integration_backend: auto
likelihood:
  model: gaussian
  include_normalization: true
parameters:
- name: metallicity
  label: log10(Z/Z_sun)
  unit: dex
  prior:
    type: uniform
    lower: -1.0
    upper: 2.0
  value: 0.5
- name: CtoO
  label: C/O
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
  value: 0.5
- name: kappa_IR
  unit: m2 kg-1
  prior:
    type: log_uniform
    lower: 1.0e-05
    upper: 1.0
  value: 0.00316
- name: gamma1
  prior:
    type: log_uniform
    lower: 0.0001
    upper: 100.0
  value: 0.1
- name: gamma2
  prior:
    type: log_uniform
    lower: 0.0001
    upper: 100.0
  value: 0.1
- name: T_irr
  unit: K
  prior:
    type: uniform
    lower: 800.0
    upper: 2200.0
  value: 1500.0
- name: alpha
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
  value: 0.5
- name: log_SO2
  label: log10(SO2 VMR)
  prior:
    type: uniform
    lower: -10.0
    upper: -4.0
  value: -8.0
sampler:
  engine: optimal_estimation
  live_points: 400
  dlogz: 0.5
  resume: resume
  show_status: true
  seed: 2712
  oe_max_iterations: 8
runtime:
  mpi_processes: auto
plotting:
  enabled: true
