# Two-region emission example. The hot column inherits the top-level WASP-69b model.
# The cold-region parameters are listed explicitly below for adaptation.

schema_version: 2
paths:
  observations_directory: ../data/wasp69b_schlawin2024
  fastchem_directory: ../data/chemistry/fastchem
  k_table_directory: ../opacity_data/ktables_exomol
  optical_constants_directory: ../data/optical_constants/exo_skryer
  output_directory: ../examples/outputs/hot_jupiter_two_region_emission
  opacity_cache_directory: ../examples/outputs/hot_jupiter_two_region_emission/opacity_cache
  scratch_directory: ../examples/outputs/hot_jupiter_two_region_emission/scratch
  project_directory: ..
run:
  name: hot-jupiter-two-region-emission
  description: WASP-69b independent hot and cold MgSiO3 cloud emission retrieval.
bodies:
  planet:
    name: WASP-69b
    radius_m: 75781520.0
    mass_kg: 4.935138e26
  star:
    name: WASP-69
    radius_m: 565568100.0
    effective_temperature_k: 4750.0
    log_g_cgs: 4.5
    metallicity_dex: 0.0
    spectrum_model: phoenix
observations:
  loader: schlawin2024_wasp69b
  datasets:
  - f322w2
  - f444w
  - lrs
  verify_checksum: true
atmosphere:
  pressure:
    bottom_bar: 100.0
    top_bar: 1.0e-06
    layers: 80
  temperature:
    model: parmentier_guillot_2014
    internal_temperature_k: 100.0
  chemistry:
    model: fastchem_equilibrium
    metallicity_parameter: metallicity
    carbon_to_oxygen_parameter: CtoO
    species:
    - label: H2O
      fastchem_name: H2O1
    - label: CO2
      fastchem_name: C1O2
    - label: CO
      fastchem_name: C1O1
    - label: CH4
      fastchem_name: C1H4
    - label: NH3
      fastchem_name: H3N1
    - label: SO2
      fastchem_name: O2S1
    - label: H2
      fastchem_name: H2
    - label: He
      fastchem_name: He
    constant_log10_vmr_parameters:
      SO2: log_SO2
clouds:
  model: mie_catalog
  material: MgSiO3
  particle_density_kg_m3: 3200.0
  geometric_stddev: 1.0
  quadrature_points: 1
  multiple_scattering_backend: sh4
opacity:
  format: exomol_kta
  resolution: R1000
  species:
  - H2O
  - CO2
  - CO
  - CH4
  - NH3
  - SO2
  binning:
    num: 300
    use_rebin: false
    remove_zeros: true
radiative_transfer:
  model: emission
  geometry:
    model: normal_emission
    points: 4
  include_rayleigh: true
  gas_combination: random_overlap
  thermal_integration_backend: auto
likelihood:
  model: gaussian
  include_normalization: true
parameters:
- name: metallicity
  label: '[M/H]'
  unit: dex
  prior:
    type: uniform
    lower: 0.0
    upper: 2.0
- name: CtoO
  label: C/O
  prior:
    type: uniform
    lower: 0.05
    upper: 1.5
- name: log_SO2
  label: log10(SO2 VMR)
  prior:
    type: uniform
    lower: -10.0
    upper: -4.0
- name: kappa_IR
  label: hot kappa_IR
  unit: m2 kg-1
  prior:
    type: log_uniform
    lower: 1.0e-05
    upper: 1.0
- name: gamma1
  label: hot gamma1
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: gamma2
  label: hot gamma2
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: T_irr
  label: hot T_irr
  unit: K
  prior:
    type: uniform
    lower: 800.0
    upper: 2200.0
- name: alpha
  label: hot alpha
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
- name: log_cloud_mass_fraction
  label: hot cloud mass fraction
  prior:
    type: uniform
    lower: -12.0
    upper: -2.0
- name: log_cloud_radius_micron
  label: hot cloud radius
  prior:
    type: uniform
    lower: -3.0
    upper: 1.0
- name: log_cloud_top_pressure_bar
  label: hot cloud top
  prior:
    type: uniform
    lower: -6.0
    upper: -2.0
- name: log_cloud_base_pressure_bar
  label: hot cloud base
  prior:
    type: uniform
    lower: -1.0
    upper: 2.0
- name: cold_kappa_IR
  unit: m2 kg-1
  prior:
    type: log_uniform
    lower: 1.0e-05
    upper: 1.0
- name: cold_gamma1
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: cold_gamma2
  prior:
    type: log_uniform
    lower: 0.01
    upper: 100.0
- name: cold_T_irr
  unit: K
  prior:
    type: uniform
    lower: 400.0
    upper: 1400.0
- name: cold_alpha
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
- name: cold_log_cloud_mass_fraction
  prior:
    type: uniform
    lower: -12.0
    upper: -2.0
- name: cold_log_cloud_radius_micron
  prior:
    type: uniform
    lower: -3.0
    upper: 1.0
- name: cold_log_cloud_top_pressure_bar
  prior:
    type: uniform
    lower: -6.0
    upper: -2.0
- name: cold_log_cloud_base_pressure_bar
  prior:
    type: uniform
    lower: -1.0
    upper: 2.0
- name: hot_area_fraction
  label: hot area fraction
  prior:
    type: uniform
    lower: 0.0
    upper: 1.0
sampler:
  engine: multinest
  live_points: 1000
  dlogz: 0.5
  resume: resume
  show_status: false
  seed: 6904
  multinest_max_iterations: 0
runtime:
  mpi_processes: auto
plotting:
  enabled: true
disk_emission:
  model: two_region
  hot_fraction_parameter: hot_area_fraction
  hot_region: {}
  cold_region:
    atmosphere:
      temperature:
        model: parmentier_guillot_2014
        internal_temperature_k: 100.0
        kappa_ir_parameter: cold_kappa_IR
        gamma1_parameter: cold_gamma1
        gamma2_parameter: cold_gamma2
        irradiation_temperature_parameter: cold_T_irr
        alpha_parameter: cold_alpha
    clouds:
      model: mie_catalog
      material: MgSiO3
      particle_density_kg_m3: 3200.0
      geometric_stddev: 1.0
      quadrature_points: 1
      log10_mass_fraction_parameter: cold_log_cloud_mass_fraction
      log10_radius_micron_parameter: cold_log_cloud_radius_micron
      log10_top_pressure_bar_parameter: cold_log_cloud_top_pressure_bar
      log10_base_pressure_bar_parameter: cold_log_cloud_base_pressure_bar
      multiple_scattering_backend: sh4
