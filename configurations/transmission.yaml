# Bundled R=100 transmission example for a hot-Jupiter free-chemistry run.
# R=100 is deliberate for a local check; use R=1000 plus external tables for science.

schema_version: 2
paths:
  observations_directory: ../../ROBERT-runs/hot-jupiter-transmission-r100/outputs/synthetic_observation.npz
  opacity_cache_directory: ../../ROBERT-runs/hot-jupiter-transmission-r100/opacity_cache
  output_directory: ../../ROBERT-runs/hot-jupiter-transmission-r100/outputs
  scratch_directory: ../../ROBERT-runs/hot-jupiter-transmission-r100/scratch
  project_directory: ../../ROBERT-runs/hot-jupiter-transmission-r100
run:
  name: hot-jupiter-transmission-r100
  description: Bundled R=100 hot-Jupiter free-chemistry transmission quickstart. For
    JWST science, set resolution to R1000 and provide the external ktables_exomol
    path.
bodies:
  planet:
    name: Synthetic hot Jupiter b
    radius_m: 80000000.0
    mass_kg: 1.1502935e27
  star:
    name: Synthetic K dwarf
    radius_m: 600000000.0
    effective_temperature_k: 5000.0
    log_g_cgs: 4.5
    metallicity_dex: 0.0
    spectrum_model: blackbody
observations:
  loader: robert_npz
  datasets:
  - synthetic_transmission
  verify_checksum: false
  dataset_options: {}
atmosphere:
  pressure:
    bottom_bar: 10.0
    top_bar: 1.0e-07
    layers: 32
  temperature:
    model: isothermal
    temperature_k: 1100.0
  chemistry:
    model: free
    species:
    - H2O
    parameter_mode: log10
    parameter_names:
      H2O: log_H2O
    fixed_mixing_ratios: {}
    background_species:
    - H2
    - He
    background_fractions:
    - 0.8547
    - 0.1453
    fill_background: true
    excess_policy: raise
clouds:
  model: none
opacity:
  format: exomol_kta
  resolution: R100
  species:
  - H2O
  binning:
    num: 100
    use_rebin: false
    remove_zeros: true
    g_points: 8
radiative_transfer:
  model: transmission
  include_rayleigh: true
  gas_combination: random_overlap
  reference_pressure_bar: 1.0
  gravity_model: inverse_square
  impact_quadrature_order: 4
likelihood:
  model: gaussian
  include_normalization: true
parameters:
- name: log_H2O
  label: log10 H2O VMR
  value: -3.3
  prior:
    type: uniform
    lower: -4.5
    upper: -2.0
sampler:
  engine: multinest
  live_points: 60
  multinest_max_iterations: 0
  dlogz: 0.8
  sampling_efficiency: 0.8
  importance_nested_sampling: true
  multimodal: false
  iterations_before_update: 20
  resume: overwrite
  show_status: true
  seed: 3141
plotting:
  enabled: true
  retrieval: true
  forward: false
  style: default
  image_format: png
  dpi: 150
  max_posterior_samples: 5000
  posterior_predictive_samples: 100
  dataset_colors:
    synthetic_transmission: mediumpurple
  parameter_labels:
    log_H2O: log10 H2O VMR
runtime:
  mpi_processes: auto
